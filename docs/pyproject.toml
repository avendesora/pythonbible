[project]
name = "pythonbible-docs"
version = "0.15.4"
description-file = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Nathan Patton", email = "npatton@gmail.com" }
]
readme = "README.md"
license = "MIT"
urls = { Documentation = "https://docs.python.bible", Source = "https://github.com/avendesora/pythonbible" }
dependencies = [
    "furo>=2025.7.19",
    "jupyter>=1.1.1",
    "pythonbible",
    "sphinx>=8,<9",
    "sphinx-copybutton>=0.5.2",
    "sphinx-toolbox>=4.1.1",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "COM",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "N",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "TCH",
    "TID",
    "TRY",
    "T10",
    "T20",
    "W",
]
ignore = [
    "COM812",  # conflicts with formatter
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D205",
    "D203",
    "D213",
    "ISC001",  # conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"source/_static/pythonbible-book-groups.ipynb" = ["E501", "T201"]
"source/conf.py" = ["A001", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
